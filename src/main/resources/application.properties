spring.application.name=hotel-reservation

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/hotel
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate only checks the schema; it never changes it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Flyway builds the schema from db/migration
spring.flyway.enabled=true

# JWT
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes-long}
app.jwt.expiration-minutes=60